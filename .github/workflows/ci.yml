name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Check auth switch safety
        shell: bash
        run: bash scripts/check-auth-switch-safety.sh
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all
      - name: Build the native macOS app
        run: bash scripts/build-macos-app.sh
