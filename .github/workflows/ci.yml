name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # New advisories appear without any code change, so re-audit weekly.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on known vulnerabilities; unmaintained-crate warnings do not fail.
      - name: Audit Cargo.lock
        run: cargo audit

  test:
    name: macOS
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Check auth switch safety
        shell: bash
        run: bash scripts/check-auth-switch-safety.sh
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all
      - name: Run Swift tests
        run: |
          set -euo pipefail
          test_ids=$(swift test --package-path macos/NextAccount list)
          if [[ -z "$test_ids" ]]; then
            echo "Swift test discovery returned no tests" >&2
            exit 1
          fi
          while IFS= read -r test_id; do
            filter_id=${test_id%%(*}
            swift test --package-path macos/NextAccount --skip-build --filter "$filter_id"
          done <<< "$test_ids"
      - name: Build the native macOS app
        run: bash scripts/build-macos-app.sh
