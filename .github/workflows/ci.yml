name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Check auth switch safety
        shell: bash
        run: bash scripts/check-auth-switch-safety.sh
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all
      - name: Set up .NET for the Windows Preview
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build the native Windows Preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload the Windows Preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: Codex-Roster-Windows-Preview-x64
          path: build/windows/Codex-Roster-Windows-x64.zip
          if-no-files-found: error
      - name: Build the native macOS app
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-app.sh
