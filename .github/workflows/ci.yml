name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Lets a maintainer re-run the suite on demand (`gh workflow run ci.yml`).
  workflow_dispatch:
  # New advisories appear without any code change, so re-audit weekly.
  schedule:
    - cron: "17 6 * * 1"

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit
      # Fails on known vulnerabilities; unmaintained-crate warnings do not fail.
      - name: Audit Cargo.lock
        run: cargo audit

  test:
    name: macOS
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check auth switch safety
        shell: bash
        run: bash scripts/check-auth-switch-safety.sh
      - name: Check formatting
        run: cargo fmt --check
      # --locked: a stale or edited lockfile must fail the build, not silently
      # resolve different dependency versions than the release (audit C1).
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all
      - name: Run Swift tests
        run: |
          set -euo pipefail
          test_ids=$(swift test --package-path macos/NextAccount list)
          if [[ -z "$test_ids" ]]; then
            echo "Swift test discovery returned no tests" >&2
            exit 1
          fi
          while IFS= read -r test_id; do
            filter_id=${test_id%%(*}
            swift test --package-path macos/NextAccount --skip-build --filter "$filter_id"
          done <<< "$test_ids"
      - name: Build the native macOS app
        run: bash scripts/build-macos-app.sh
