name: Windows preview bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build the Windows desktop bundle
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload the Windows preview bundle
        uses: actions/upload-artifact@v6
        with:
          name: Codex-Roster-Windows-x64
          path: build/windows/Codex-Roster-Windows-x64.zip
          if-no-files-found: error
