name: Windows desktop release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build the Windows desktop bundle
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Attach the Windows desktop bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:RELEASE_TAG build/windows/Codex-Roster-Windows-x64.zip --clobber
