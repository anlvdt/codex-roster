[package]
name = "codex-roster"
version = "0.4.2"
edition = "2024"
description = "Account switching for Codex CLI and IDE"
license = "MIT"
repository = "https://github.com/anlvdt/codex-roster"
homepage = "https://github.com/anlvdt/codex-roster"
readme = "README.md"
keywords = ["codex", "cli", "ide", "accounts"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
age = "0.11.2"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"] }
console = "0.16.3"
dialoguer = "0.12.0"
directories = "6.0.0"
flate2 = "1.1.5"
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sysinfo = "0.38.4"
time = { version = "0.3.47", features = ["formatting", "local-offset", "parsing", "serde"] }
ureq = { version = "3.1.2", features = ["json"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
